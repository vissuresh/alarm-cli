[project]
name = "alarm-cli"
dynamic = ["version"]
description = "A one-off alarm clock for the terminal, with zero runtime dependencies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Zero runtime dependencies is goal 1 of this project; adding one needs a
# decision record in docs/changelog.md (see DR-4).
dependencies = []

[project.scripts]
alarm = "alarm_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: alarm_cli.__version__.
[tool.hatch.version]
path = "src/alarm_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/alarm_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
